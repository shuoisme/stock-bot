name: Check Stock

on:
  schedule:
    # 台灣 11:00 (UTC 03:00)
    - cron: '0 3 * * 1-5'
    # 台灣 13:00 (UTC 05:00)
    - cron: '0 5 * * 1-5'
    # 台灣 13:45 (UTC 05:45)
    - cron: '45 5 * * 1-5'
  
  # 允許手動按按鈕
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 👇 關鍵 1：給機器人寫入權限 (這樣用內建 Token 也可以)
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests PyGithub

    - name: Run stock bot
      # 👇 關鍵 2：這裡就是「遞鑰匙」的動作，缺一不可！
      env:
        LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        # 👇 這裡很重要！我們把 GitHub 內建的鑰匙 (GITHUB_TOKEN) 交給機器人
        # 這樣你就不用擔心有沒有設定 GH_TOKEN 了，內建的最穩！
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python main.py
