name: 股票監控

on:
  schedule:
    - cron: '*/5 1-6 * * 1-5' # 台灣時間 09:00 - 14:00 每5分
  workflow_dispatch:          # 允許手動按按鈕測試

# 👇 關鍵修改 1：給予機器人「寫入權限」，讓它可以記錄今天已通知過
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      
      - run: pip install -r requirements.txt
      
      - env:
          # 👇 關鍵修改 2：傳入 LINE 權杖 與 GitHub 權杖
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 這是 GitHub 內建的，不用自己設定 Secret
        run: python main.py
