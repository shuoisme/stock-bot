name: Check Stock

on:
  schedule:
    # 台灣 11:00 (UTC 03:00)
    - cron: '0 3 * * 1-5'
    # 台灣 13:00 (UTC 05:00)
    - cron: '0 5 * * 1-5'
    # 台灣 13:45 (UTC 05:45)
    - cron: '45 5 * * 1-5'
  
  # 允許手動按按鈕
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 👇 關鍵 1：給機器人寫入權限 (這樣用內建 Token 也可以)
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests PyGithub

    - name: Run stock bot
      # 👇 關鍵 2：這裡就是「遞鑰匙」的動作，缺一不可！
      env:
          # 👇 這裡就是關鍵！要把鑰匙傳進去
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FUGLE_TOKEN: ${{ secrets.FUGLE_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # 這是 GitHub 內建的，或者是你自己設的
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 備用
      run: python main.py
